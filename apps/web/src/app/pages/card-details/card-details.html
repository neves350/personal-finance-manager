<main class="w-full">
  <div class="max-w-5xl mx-auto py-3 space-y-8">
    <app-card-header [card]="activeCard" (cardUpdated)="refreshCard()" />

    <div class="grid grid-cols-1 lg:grid-cols-3 mt-6">
      <div class="lg:col-span-2 lg:mr-4">
        <app-card-cashflow [card]="activeCard" />
      </div>
      <app-card-summary [card]="activeCard" />
    </div>

    <app-card-recent [card]="activeCard" />
  </div>
</main>
