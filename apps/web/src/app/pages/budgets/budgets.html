<main class="w-full">
  <div class="max-w-500 mx-auto py-3 lg:py-6 space-y-8">
    <app-page-header title="Budgets" subtitle="Track your budgets and see if you're on the right track.">

      @if (hasBudgets()) {
      <div class="flex items-center gap-2">
        <z-button class="cursor-pointer" zType="default" (click)="openEnvelope()">
          <i-lucide [img]="PlusIcon" />
          <span class="hidden sm:inline">Envelope</span>
        </z-button>

        @if (envelopes().length >= 2) {
        <z-button class="cursor-pointer" zType="outline" (click)="openTransfer()">
          <i-lucide [img]="ArrowLeftRightIcon" />
          <span class="hidden sm:inline">Transfer</span>
        </z-button>
        }
        @if (envelopes().length === 0) {
        <z-button class="cursor-pointer" zType="outline" (click)="copyPrevious()">
          <i-lucide [img]="CopyIcon" />
          <span class="hidden sm:inline">Copy Previous</span>
        </z-button>
        }
      </div>
      }
    </app-page-header>

    <app-budget-month-selector />

    @if (isLoading()) {
    <div class="flex flex-col items-center justify-center gap-2 min-h-[60vh]">
      <z-loader />
      <span class="text-sm text-muted-foreground">Loading budgets...</span>
    </div>
    } @else if (hasBudgets()) {
    @if (summary(); as s) {
    <app-budget-summary [summary]="s" />
    }
    <app-envelope-list [envelopes]="envelopes()" [budgetId]="budget()!.id" />
    } @else {
    <z-card class="dashed-card bg-background mt-4">
      <div class="flex flex-col items-center justify-center p-6 mt-6">
        <div class="size-12 flex items-center justify-center rounded-sm bg-primary/20 text-primary mb-4">
          <i-lucide [img]="BadgeEuroIcon" class="size-5" />
        </div>

        <div class="flex flex-col items-center text-center">
          <div class="space-y-2">
            <p class="font-medium">No budgets added</p>
            <span class="text-muted-foreground">
              Set budgets to ...
            </span>
          </div>
        </div>
      </div>
    </z-card>
    }
  </div>
</main>
