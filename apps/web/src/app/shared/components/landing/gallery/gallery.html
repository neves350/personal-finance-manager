<section class="pt-10 px-10 pb-25">
  <div class="max-w-160 mx-auto mb-12 text-center flex flex-col gap-4">
    <span class="text-primary text-xs md:text-sm tracking-[.08em] uppercase font-semibold">A closer look</span>
    <h2 class="font-['Space_Grotesk'] font-semibold text-3xl md:text-4xl tracking-[-0.02em] m-0">
      Designed to stay out of your way
    </h2>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5.5">
    @for (card of cards; track card.title) {
      <div
        class="rounded-lg border border-border overflow-hidden bg-card transition-transform duration-300 hover:-translate-y-2">
        <div class="relative h-37 md:h-40 xl:h-57.5 overflow-hidden">
          <img [src]="card.image" [alt]="card.alt" fill class="object-cover" />
        </div>
        <div class="px-4.5 md:px-5.5 py-3.5 md:py-4.5 border-t border-border">
          <span class="font-['Space_Grotesk'] text-sm md:text-base font-semibold">{{ card.title }}</span>
          <span class="text-muted-foreground text-sm"> {{ card.description }}</span>
        </div>
      </div>
    }
  </div>
</section>
