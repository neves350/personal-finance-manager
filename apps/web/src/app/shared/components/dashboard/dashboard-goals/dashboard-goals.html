<z-card class="h-full">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-base font-semibold font-display">Savings overview</h1>
  </div>

  @if (hasGoals()) {
  <div class="xl:space-y-5 grid grid-cols-1 gap-2">
    @for (goal of displayGoals(); track goal.id) {
    <z-card class="mb-1 glass-card">
      <div class="flex items-center gap-3">
        <div class="rounded-sm flex items-center justify-center shrink-0 size-10 lg:size-12"
          [class]="goalTypeIcons[goal.type].style">
          <i-lucide [img]="goalTypeIcons[goal.type].icon" class="size-5" />
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between mb-1">
            <p class="text-sm font-medium truncate">{{ goal.title }}</p>
            <p class="text-sm font-bold font-display">{{ goal.amount | currency: 'EUR' }}</p>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex-1 h-1.5 rounded-full bg-secondary">
              <div class="h-full rounded-full transition-all bg-primary" style="width: {{ goal.progress }}%;"></div>
            </div>
            <span class="text-xs font-medium text-primary shrink-0">{{ goal.progress }}%</span>
          </div>
          <p class="text-xs text-muted-foreground mt-1">{{ getRemainingAmount(goal) | currency: 'EUR' }} left</p>
        </div>
      </div>
    </z-card>
    }
  </div>
  } @else {
  <div class="flex flex-col items-center justify-center py-8 text-muted-foreground">
    <p class="text-sm">No active goals</p>
    <a routerLink="/goals" class="text-primary text-sm mt-2 hover:underline">Create a goal</a>
  </div>
  }
</z-card>
