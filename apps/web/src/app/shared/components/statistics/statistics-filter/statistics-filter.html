<z-segmented
  #segmented
  class="px-2 py-1"
  [zOptions]="periodOptions"
  [zDefaultValue]="defaultPeriod"
  (zChange)="onPeriodChange($event)"
>
  <z-date-range-picker
    #dateRangePicker
    placeholder="Custom"
    zSize="sm"
    zFormat="MMM d, yyyy"
    (rangeChange)="onRangeChange($event)"
  />
</z-segmented>
