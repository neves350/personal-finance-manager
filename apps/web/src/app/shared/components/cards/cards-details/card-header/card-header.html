<div class="flex justify-between items-center mb-6">
  <div class="flex items-center gap-4">
    <z-button zType="ghost" routerLink="/cards">
      <i-lucide [img]="ArrowLeftIcon" />
    </z-button>
    <h1 class="font-medium flex flex-col text-base xl:text-lg">
      {{ card().name }}
      <span class="font-normal text-muted-foreground text-xs xl:text-sm">{{ typeLabel() }}</span>
    </h1>
  </div>
  @if (!isLinked()) {
    <z-button zType="goalGhost" (click)="updateCard()">
      <i-lucide [img]="SquarePenIcon" />
    </z-button>
  }
</div>
