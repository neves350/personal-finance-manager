name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      test-db:
        image: postgres:17
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: expenses_test
        options: >-
          --health-cmd "pg_isready -U test -d expenses_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/expenses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Create API .env for tests
        run: |
          cat > api/.env <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5433/expenses_test
          JWT_SECRET=test-jwt-secret-do-not-use-in-production
          JWT_EXPIRE_IN=15m
          JWT_EXPIRE_IN_MS=900000
          JWT_REFRESH_SECRET=test-jwt-refresh-secret-do-not-use-in-production
          JWT_REFRESH_EXPIRE_IN=7d
          JWT_REFRESH_EXPIRE_IN_MS=604800000
          USE_SECURE_COOKIES=false
          FRONTEND_URL=http://localhost:4200
          GOOGLE_CLIENT_ID=test-google-client-id
          SALT_EDGE_APP_ID=test-salt-edge-app-id
          SALT_EDGE_SECRET=test-salt-edge-secret
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: api
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
