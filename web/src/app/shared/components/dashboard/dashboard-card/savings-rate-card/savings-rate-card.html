<z-card>
  <div class="flex flex-col">
    <div class="flex items-center justify-between">
      <span class="text-sm font-medium tracking-wider text-muted-foreground uppercase">{{
        title()
      }}</span>
      <div class="size-10 flex items-center justify-center rounded-lg bg-balance">
        <i-lucide [img]="PercentIcon" class="size-5 text-balance-foreground" />
      </div>
    </div>

    <span class="text-3xl font-bold mt-1">{{ formattedRate() }}</span>

    <div
      class="flex items-center gap-1 text-sm mt-1"
      [class]="isPositiveChange() ? 'text-income-foreground' : 'text-expense-foreground'"
    >
      <i-lucide
        [img]="isPositiveChange() ? ArrowUpIcon : ArrowDownIcon"
        class="size-3 font-semibold"
      />
      <span>{{ formattedPercentage() }} vs {{ periodLabel() }}</span>
    </div>
  </div>
</z-card>
