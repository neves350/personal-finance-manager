<z-card class="transition-all duration-300 hover:border-primary/40">
  <div class="flex flex-col">
    <div class="flex items-center justify-start">
      <span
        class="text-xs xl:text-sm font-medium font-title tracking-wider text-muted-foreground uppercase flex items-center gap-2"
      >
        <div class="rounded-full border-2 p-2">
          <i-lucide [img]="CoinsIcon" class="h-4 w-4 xl:h-4.5 xl:w-4.5 text-primary" />
        </div>
        {{ title() }}
      </span>
    </div>

    <span class="text-2xl xl:text-3xl font-bold font-display tracking-tight text-card-foreground mt-3 xl:mt-2">
      {{ formattedBalance() | currency: 'EUR' }}
    </span>

    <div class="flex items-center gap-1.5 text-sm mt-2">
      <i-lucide
        [img]="isPositiveChange() ? ArrowUpIcon : ArrowDownIcon"
        [class]="isPositiveChange() ? 'text-success' : 'text-destructive'"
        class="size-3 font-semibold"
      />
      <span [class]="isPositiveChange() ? 'text-success' : 'text-destructive'">
        {{ formattedPercentage() }}
      </span>
      <span class="text-xs text-muted-foreground"> vs {{ periodLabel() }}</span>
    </div>
  </div>
</z-card>
