<z-card class="glass-card h-full">
  <div class="flex flex-col">
    <div class="flex items-center justify-start">
      <span
        class="text-xs lg:text-sm font-medium font-title tracking-wider text-muted-foreground uppercase flex items-center gap-2">
        <div class="rounded-sm border p-2 md:p-2.5">
          <i-lucide [img]="CoinsIcon" class="h-4 w-4 text-primary" />
        </div>
        {{ title() }}
      </span>
    </div>

    <span class="text-lg md:text-2xl lg:text-3xl font-bold font-display tracking-tight text-card-foreground mt-2">
      {{ formattedBalance() | currency: 'EUR' }}
    </span>

    <div class="flex items-center gap-1.5 text-xs md:text-sm mt-2">
      <i-lucide [img]="isPositiveChange() ? ArrowUpIcon : ArrowDownIcon"
        [class]="isPositiveChange() ? 'text-primary' : 'text-destructive'" class="size-3 font-semibold" />
      <span [class]="isPositiveChange() ? 'text-primary' : 'text-destructive'">
        {{ formattedPercentage() }}
      </span>
      <span class="text-xs text-muted-foreground"> vs {{ periodLabel() }}</span>
    </div>
  </div>
</z-card>
