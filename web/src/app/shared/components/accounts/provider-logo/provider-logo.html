@if (logoUrl() && !imgError()) {
  <img
    [src]="logoUrl()"
    [alt]="providerName()"
    class="size-10 rounded-lg object-contain bg-white shrink-0"
    (error)="imgError.set(true)"
  />
} @else {
  <div
    class="size-10 rounded-lg flex items-center justify-center text-foreground text-xs font-bold shrink-0"
    [class]="fallback().color"
  >
    {{ fallback().initials }}
  </div>
}
