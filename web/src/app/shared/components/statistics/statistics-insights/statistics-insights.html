<z-card class="h-full overflow-y-hidden">
  <h2 class="text-lg font-semibold">Insights & Overview</h2>

  <div class="flex flex-col gap-4 mt-6">
    @for (insight of insights(); track $index) {
      <div class="rounded-lg border p-4" [class]="insight.border + ' ' + insight.bg">
        <div class="flex items-center gap-2" [class]="insight.color">
          <i-lucide [img]="insight.icon" class="size-4" />
          <span class="uppercase text-xs font-semibold">{{ insight.label }}</span>
        </div>
        <p class="text-sm mt-2">{{ insight.message }}</p>
      </div>
    }
  </div>
</z-card>
