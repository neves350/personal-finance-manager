<div class="rounded-md border border-input bg-card p-3 space-y-2">
  <div class="grid grid-cols-6 gap-1">
    @for (icon of visibleIcons(); track icon) {
      <button
        type="button"
        [class]="getIconClasses(icon)"
        [attr.aria-label]="icon"
        (click)="selectIcon(icon)"
      >
        <i-lucide [img]="iconMap[icon]" class="size-4" />
      </button>
    }

    @if (!expanded()) {
      <button
        type="button"
        class="flex items-center justify-center p-2 rounded-md border border-transparent hover:bg-accent cursor-pointer transition-colors text-muted-foreground text-sm"
        aria-label="Show all icons"
        (click)="toggleExpanded()"
      >
        ...
      </button>
    }
  </div>

  @if (expanded()) {
    <button
      type="button"
      class="w-full text-xs text-muted-foreground hover:text-foreground transition-colors cursor-pointer pt-1"
      (click)="toggleExpanded()"
    >
      Show less
    </button>
  }
</div>
