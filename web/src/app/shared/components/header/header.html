<div class="flex flex-1 items-center justify-between gap-2">
  <div class="flex items-center gap-2">
    <button
      class="inline-flex items-center justify-center rounded-md p-2 text-muted-foreground hover:bg-accent hover:text-accent-foreground lg:hidden"
      (click)="toggleSidebar()"
      aria-label="Toggle navigation menu"
    >
      <i-lucide [img]="MenuIcon" class="size-5" />
    </button>
    <z-breadcrumb zWrap="wrap" zAlign="start" [zSeparator]="customSeparator">
    @for (crumb of breadcrumbs(); track $index; let last = $last) {
      @if (!last) {
        <z-breadcrumb-item [routerLink]="['/']" class="ml-0.5 mr-1.5">
          {{ crumb.label }}
        </z-breadcrumb-item>
      } @else {
        <z-breadcrumb-item class="ml-0.5 mr-0.5">{{ crumb.label }}</z-breadcrumb-item>
      }
    }
  </z-breadcrumb>
  </div>

  <ng-template #customSeparator>
    <span class="text-muted-foreground ml-1">/</span>
  </ng-template>

  <div class="flex items-center justify-end gap-2">
    <app-notification-panel />
    <app-theme />
  </div>
</div>
