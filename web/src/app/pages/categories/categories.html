<main class="p-4 md:p-6 lg:p-8">
  <div class="max-w-300 mx-auto py-3 space-y-6">
    <div class="flex justify-between items-start">
      <h1 class="flex flex-col page-title">
        Categories
        <span class="page-subtitle"> Organize your transactions with custom categories. </span>
      </h1>

      <div class="flex items-center gap-3">
        <z-button zType="default" (click)="addCategory()">
          <i-lucide [img]="PlusIcon" />
          New Category
        </z-button>
      </div>
    </div>

    @if (isLoading()) {
    <div class="flex flex-col items-center justify-center gap-2 min-h-[60vh]">
      <z-loader />
      <span class="text-sm text-muted-foreground">Loading categories...</span>
    </div>
    } @else {
    <z-tab-group class="items-center" zAlignTabs="center" zTabsPosition="custom" zActivePosition="custom">
      <z-tab [label]="'Expenses (' + expenseCategories().length + ')'">
        <app-categories-list [categories]="expenseCategories()" />
      </z-tab>
      <z-tab [label]="'Income (' + incomeCategories().length + ')'">
        <app-categories-list [categories]="incomeCategories()" />
      </z-tab>
    </z-tab-group>
    }
  </div>
</main>
