<main class="p-6 xl:p-8">
  <div class="max-w-500 mx-auto py-3 space-y-6">
    <div class="flex justify-between items-start">
      <h1 class="flex flex-col page-title">
        Goals
        <span class="page-subtitle">
          Track your goals and see if you're on the right track.
        </span>
      </h1>

      <div class="justify-end">
        <z-button class="cursor-pointer" (click)="openSheet()">
          <i-lucide [img]="PlusIcon" />
          New Goal
        </z-button>
      </div>
    </div>

    <!-- Cards with goals -->
    @if (isLoading()) {
      <div class="flex flex-col items-center justify-center gap-2 min-h-[60vh]">
        <z-loader />
        <span class="text-sm text-muted-foreground">Loading goals...</span>
      </div>
    } @else if (hasGoals()) {
      <z-tab-group class="items-center" zAlignTabs="center" zTabsPosition="custom" zActivePosition="custom">
        <z-tab [label]="'On Track (' + activeGoals().length + ')'">
          <app-goals-list [goals]="activeGoals()" />
        </z-tab>
        <z-tab [label]="'Completed (' + completedGoals().length + ')'">
          <app-goals-list [goals]="completedGoals()" />
        </z-tab>
      </z-tab-group>
    } @else {
      <z-card class="flex flex-col mt-4">
        <div class="flex flex-col items-center justify-center p-6 mt-6">
          <div
            class="size-12 flex items-center justify-center rounded-full bg-primary/20 text-primary mb-4"
          >
            <i-lucide [img]="GoalIcon" class="size-5" />
          </div>

          <div class="flex flex-col items-center text-center">
            <div class="space-y-2">
              <p class="font-medium">No goals added</p>
              <span class="text-muted-foreground">
                Set goals to save money or control spending in specific categories.
              </span>
            </div>
          </div>
        </div>
      </z-card>
    }
  </div>
</main>
