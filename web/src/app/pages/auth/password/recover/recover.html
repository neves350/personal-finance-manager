<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-background font-sans">
  <main class="w-full max-w-md">
    <div class="overflow-hidden">
      <div class="p-8 sm:p-12">
        <div class="flex flex-col items-center text-center mb-5">
          <div class="flex items-center justify-center mb-4">
            <span class="text-3xl">
              <z-avatar
                zSrc="spendly-logo.svg"
                zAlt="Application logo"
                zSize="md"
                zShape="rounded"
              />
            </span>
          </div>
          <h2 class="text-[22px] font-bold tracking-tight text-white">Forgot password?</h2>
          <div class="p-4 text-center">
            <p class="text-sm text-muted-foreground/50">
              No worries, we'll send you reset instructions.
            </p>
          </div>
        </div>

        <z-divider class="mt-4 mb-6" />

        <form class="space-y-6" (ngSubmit)="onSubmit()" [formGroup]="form">
          <div class="space-y-2">
            <label class="block text-sm font-semibold">Email</label>
            <input
              z-input
              zSize="lg"
              type="email"
              placeholder="john@example.com"
              formControlName="email"
              required
              class="rounded-md border border-zinc-400/50 p-3 text-sm text-muted-foreground"
            />
            @if (form.get('email')?.touched && form.get('email')?.errors?.['required']) {
              <span class="text-xs font-medium text-red-500 dark:text-red-400"
                >Email is required</span
              >
            }
            @if (form.get('email')?.touched && form.get('email')?.hasError?.('email')) {
              <span class="text-xs font-medium text-red-500 dark:text-red-400"
                >Enter a valid email</span
              >
            }
          </div>

          <button
            z-button
            type="submit"
            [zDisabled]="form.invalid"
            zFull
            zSize="lg"
            class="flex items-center justify-center text-sm font-semibold"
          >
            Reset password
            <i-lucide [img]="ArrowRightIcon" class="h-4" />
          </button>
        </form>

        <button
          z-button
          routerLink="/login"
          type="submit"
          zFull
          zSize="lg"
          zType="link"
          class="flex items-center justify-center text-sm font-semibold mt-2"
        >
          Back to login
        </button>
      </div>
    </div>
  </main>
</div>
