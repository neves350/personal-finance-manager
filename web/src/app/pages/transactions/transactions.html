<main>
  <div class="max-w-500 mx-auto py-3 space-y-6">
    <app-page-header title="Transactions" subtitle="Manage your income and expenses.">
      <z-button zType="default" (click)="openDialog()" class="hidden sm:inline-flex">
        <i-lucide [img]="PlusIcon" />
        New Transaction
      </z-button>
      <app-transactions-export class="hidden sm:contents" />
    </app-page-header>

    <app-transactions-toolbar (searchChange)="searchQuery.set($event)">
      <app-transactions-export class="sm:hidden" />
    </app-transactions-toolbar>

    @if (isLoading()) {
    <div class="flex flex-col items-center justify-center gap-2 min-h-[60vh]">
      <z-loader />
      <span class="text-sm text-muted-foreground">Loading transactions...</span>
    </div>
    } @else if (hasTransactions()) {
    <app-transactions-summary />
    <app-transactions-list [transactions]="filteredTransactions()" />
    } @else {
    <z-card class="dashed-card bg-background mt-4">
      <div class="flex flex-col items-center justify-center p-6">
        <div class="size-12 flex items-center justify-center rounded-sm bg-primary/20 text-primary mb-4">
          <i-lucide [img]="ArrowRightLeftIcon" class="size-5" />
        </div>

        <div class="flex flex-col items-center text-center">
          <div class="space-y-2">
            <p class="font-medium">No activity</p>
            <span class="text-muted-foreground text-sm">
              You haven't registered anything this month yet.
            </span>
          </div>
        </div>
      </div>
    </z-card>
    }
  </div>
</main>
