<main class="p-6 xl:p-8">
  <div class="max-w-500 mx-auto py-3 space-y-6">
    <div class="flex justify-between items-start">
      <h1 class="flex flex-col page-title">
        Cards
        <span class="page-subtitle">
          Manage your credit and debit cards.
        </span>
      </h1>

      <div class="flex items-center gap-3">
        <z-select
          class="w-50"
          zPlaceholder="All bank accounts"
          [zValue]="selectedBankAccountId() ?? 'all'"
          (zSelectionChange)="onBankAccountFilterChange($any($event))"
        >
          <z-select-item zValue="all">All bank accounts</z-select-item>
          @for (account of bankAccounts(); track account.id) {
            <z-select-item [zValue]="account.id!">
              <span>{{ account.name }}</span>
            </z-select-item>
          }
        </z-select>

        <z-button class="cursor-pointer" zType="outline" (click)="openSheet()">
          <i-lucide [img]="PlusIcon" />
          New card
        </z-button>
      </div>
    </div>

    @if (hasCards()) {
      <app-cards-list [cards]="cards()" />
    } @else {
      <z-card class="w-full h-full flex flex-col">
        <div class="flex flex-col items-center justify-center p-6">
          <div
            class="size-12 flex items-center justify-center rounded-full bg-primary/20 text-primary mb-4"
          >
            <i-lucide [img]="CreditCardIcon" />
          </div>

          <div class="flex flex-col items-center text-center">
            <div class="space-y-2">
              <p class="font-medium">No cards added</p>
              <span class="text-muted-foreground text-sm">
                Add your cards to track spending and available credit limits.
              </span>
            </div>
          </div>
        </div>
      </z-card>
    }
  </div>
</main>
