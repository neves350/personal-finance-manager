<main class="p-4 xl:p-6 w-full">
  <div class="max-w-500 mx-auto py-3 xl:py-6 space-y-8 xl:space-y-12">
    <div class="flex justify-between items-start">
      <h1 class="font-medium flex flex-col text-lg">
        Statistics
        <span class="font-normal text-muted-foreground text-sm">
          Analyze your spending and identify patterns.
        </span>
      </h1>

      <div class="flex items-center gap-3">
        <app-statistics-filter (filterChange)="onFilterChange($event)" />
      </div>
    </div>

    @if (isLoading()) {
      <div class="flex flex-col items-center justify-center gap-2 min-h-[60vh]">
        <z-loader />
        <span class="text-sm text-muted-foreground">Loading statistics...</span>
      </div>
    } @else if (hasData()) {
      <app-statistics-summary />
      <div class="grid grid-cols-1 xl:grid-cols-2 xl:gap-3 mb-3 xl:mb-4">
        <app-statistics-categories />
        <app-statistics-period class="col-span-1" />
      </div>
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-3 items-stretch *:h-full">
        <app-statistics-breakdown />
        <app-statistics-insights />
      </div>
    } @else {
      <z-card class="flex flex-col mt-4">
        <div class="flex flex-col items-center justify-center p-6 mt-6">
          <div
            class="size-12 flex items-center justify-center rounded-full bg-primary/20 text-primary mb-4"
          >
            <i-lucide [img]="ChartPieIcon" class="size-5" />
          </div>

          <div class="flex flex-col items-center text-center">
            <div class="space-y-2">
              <p class="font-medium">No activity.</p>
              <span class="text-muted-foreground">
                You haven't registered anything this month yet.
              </span>
            </div>
          </div>
        </div>
      </z-card>
    }
  </div>
</main>
